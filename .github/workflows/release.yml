name: Build & Release ScrcpyDock Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Portable
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Smoke Tests
        run: flutter test

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Package Portable Windows Zip
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          $zipName = "ScrcpyDock-${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipName -Force

      - name: Build Windows Setup Installer
        shell: pwsh
        run: |
          & "iscc" /DMyAppVersion="${{ github.ref_name }}" installer.iss

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            ScrcpyDock-*-windows-setup-x64.exe
            ScrcpyDock-*-windows-x64.zip

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Application
        run: flutter build linux --release

      - name: Package Linux Tarball
        run: |
          ZIP_NAME="ScrcpyDock-${{ github.ref_name }}-linux-x64.tar.gz"
          tar -czvf "$ZIP_NAME" -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: ScrcpyDock-*-linux-x64.tar.gz

  build-macos:
    name: Build macOS Universal
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Application
        run: flutter build macos --release

      - name: Package macOS Zip
        run: |
          ZIP_NAME="ScrcpyDock-${{ github.ref_name }}-macos.zip"
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -n 1)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: ScrcpyDock-*-macos.zip

  publish-release:
    name: Publish Multi-Platform GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten Artifact Directory
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          ls -la release-files

      - name: Create GitHub Release with All Platforms
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          draft: false
          prerelease: false
          make_latest: true
          name: "ScrcpyDock ${{ github.ref_name }} - Official Release"
          body: |
            ## 🚀 ScrcpyDock ${{ github.ref_name }}

            Thank you for supporting **ScrcpyDock**! The lightweight, ultra-responsive visual dock controller for Scrcpy & Android.

            ### 📦 Download Packages

            | Platform | File | Type | Description |
            | :--- | :--- | :--- | :--- |
            | **Windows** | `ScrcpyDock-${{ github.ref_name }}-windows-setup-x64.exe` | **Installer (Recommended)** | Single-click setup with desktop icon & Start menu. |
            | **Windows** | `ScrcpyDock-${{ github.ref_name }}-windows-x64.zip` | Portable Zip | Standalone portable bundle. Extract and run `ScrcpyDock.exe`. |
            | **macOS** | `ScrcpyDock-${{ github.ref_name }}-macos.zip` | Universal App | Extract `.app` and move to `/Applications`. |
            | **Linux** | `ScrcpyDock-${{ github.ref_name }}-linux-x64.tar.gz` | Tarball | Standalone 64-bit Linux bundle. |

            ---

            ### ✨ Key Features
            - 🎯 **Magnetic Window Docking**: Automatically attaches Scrcpy right next to the panel.
            - ⚡ **Zero-Latency USB & Wi-Fi Mirroring**: High FPS, custom bitrate, resolution & H.264/H.265.
            - 📹 **HD Webcam & Studio Mic**: Turn your Android phone into an ultra-sharp PC webcam or microphone.
            - 🤖 **MacroDock Engine**: Record screen gestures (taps, swipes, delays) and replay infinitely.
            - 📱 **Multi-Device Grid Runner**: Connect and mirror multiple phones simultaneously in clean grid formation.
            - 🛠️ **Smart Engine Assistant**: Built-in dependency helper for macOS & Linux (`brew` / `apt` commands).

            ---
            *Verify release integrity using GitHub's automatic SHA-256 hash displayed next to each download.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
