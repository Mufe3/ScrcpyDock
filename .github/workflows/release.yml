name: Build & Release ScrcpyDock

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows x64 Portable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Smoke Tests
        run: flutter test

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Package Portable Zip
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          $zipName = "ScrcpyDock-${{ github.ref_name }}-windows-x64.zip"
          $shaName = "ScrcpyDock-${{ github.ref_name }}-windows-x64.sha256"

          # Compress to zip
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipName -Force

          # Calculate SHA-256
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath $shaName -Encoding ascii

          Write-Output "Zip created: $zipName"
          Write-Output "SHA-256: $hash"

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ScrcpyDock-*.zip
            ScrcpyDock-*.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
